[workspace]
members = ["crates/lumeryn-core", "crates/lumeryn-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive", "env"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "signal", "fs"] }
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
tempfile = "=3.27.0"
schemars = { version = "=1.2.2", features = ["uuid1"] }
blake3 = "=1.8.7"

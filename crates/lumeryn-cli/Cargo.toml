[package]
name = "lumeryn-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "lumeryn"
path = "src/main.rs"

[dependencies]
lumeryn-service = { path = "../lumeryn-service", version = "=0.1.0" }
lumeryn-core = { path = "../lumeryn-core", version = "=0.1.0" }
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
schemars.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_RemoteDesktop"] }

[dev-dependencies]
tempfile.workspace = true
